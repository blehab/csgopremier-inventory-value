name: Release

# Packs the extension into a zip and publishes it as a release asset. update.bat fetches that
# asset through the /releases/latest/download/ URL, which is why the zip's filename deliberately
# carries no version.
#
# A push to main that changes manifest.json releases whatever "version" it now says: if there is
# no v<version> release yet, the tag is created on the pushed commit and the release published.
# If that version is already released, the run does nothing, so ordinary commits need no tag.
# Pushing a v<x.y.z> tag by hand (bump.ps1) still works and must match the manifest.
on:
  push:
    branches: [main]
    paths: [manifest.json]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.43.1'
        required: true

permissions:
  contents: write

# A main push and a tag push for the same version (bump.ps1 does both) must not publish at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Work out the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_version=$(node -e 'console.log(require("./manifest.json").version)')
          if [ "${{ github.ref_type }}" = "branch" ] && [ -z "${{ github.event.inputs.tag }}" ]; then
            # A push to main: release the manifest's version, unless it already is.
            tag="v$manifest_version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::notice::$tag is already released. Bump the version in manifest.json to publish a new release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag="${{ github.event.inputs.tag || github.ref_name }}"
            if [ "${tag#v}" != "$manifest_version" ]; then
              echo "::error::Tag $tag implies version ${tag#v} but manifest.json says $manifest_version."
              echo 'Bump "version" in manifest.json, commit, then tag, so the installed version matches its tag.'
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"

      - name: Pack the extension
        if: steps.v.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          # What a user needs in their unpacked-extension folder. update.bat is deliberately
          # excluded and published as its own asset instead, so an update can never overwrite
          # the script that is doing the updating.
          # setup.ps1 is run by update.bat after unpacking (bump.ps1 is a dev tool and stays out).
          cp manifest.json README.md setup.ps1 dist/pkg/
          cp ./*.js dist/pkg/
          # Zip from inside the staging dir so entries sit at the archive root and extract
          # straight into the extension folder rather than into a nested one.
          (cd dist/pkg && zip -q -r ../csgopremier-inventory-value.zip .)
          unzip -l dist/csgopremier-inventory-value.zip

      - name: Check the archive layout
        if: steps.v.outputs.skip != 'true'
        run: |
          set -euo pipefail
          unzip -Z1 dist/csgopremier-inventory-value.zip | sort > entries.txt
          if ! grep -qx 'manifest.json' entries.txt; then
            echo '::error::manifest.json is not at the root of the archive; update.bat would extract an unusable folder.'
            exit 1
          fi
          if grep -q '/' entries.txt; then
            echo '::error::Archive contains a nested directory, so extracting would not land on the extension folder.'
            exit 1
          fi
          # Every script the manifest declares must be in the archive, or the extension
          # silently loses a feature after an update.
          node -e 'const m=require("./manifest.json"); for (const s of m.content_scripts) for (const f of s.js) console.log(f); if (m.background?.service_worker) console.log(m.background.service_worker)' > declared.txt
          while read -r f; do
            if ! grep -qx "$f" entries.txt; then
              echo "::error::Declared in manifest.json but missing from the zip: $f"
              exit 1
            fi
          done < declared.txt
          echo "$(wc -l < declared.txt) content scripts packed, all declared ones present."
          if ! grep -qx 'setup.ps1' entries.txt; then
            echo '::error::setup.ps1 is missing from the zip; update.bat would skip the Chrome setup.'
            exit 1
          fi

      - name: Publish the release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.v.outputs.tag }}" \
              dist/csgopremier-inventory-value.zip update.bat --clobber
          else
            # --target creates the tag on the built commit when it doesn't exist yet (a main push).
            gh release create "${{ steps.v.outputs.tag }}" \
              dist/csgopremier-inventory-value.zip update.bat \
              --target "$(git rev-parse HEAD)" --title "${{ steps.v.outputs.tag }}" --generate-notes
          fi
